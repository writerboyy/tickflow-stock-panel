<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多周期股票数据视图</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --line: #d9e1ec;
      --line-strong: #b9c7d8;
      --text: #1f2937;
      --muted: #64748b;
      --brand: #1769aa;
      --brand-dark: #0f4f81;
      --danger: #b42318;
      --ok: #067647;
      --stripe: #f2f7fd;
      --header: #e9f1fb;
      --shadow: 0 18px 45px rgba(31, 41, 55, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(23, 105, 170, 0.12), transparent 34rem),
        linear-gradient(135deg, #fafdff 0%, var(--bg) 55%, #eef4fb 100%);
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    .app {
      width: min(1480px, calc(100vw - 32px));
      margin: 24px auto;
    }

    .title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0.04em;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(5, 170px) 1fr;
      gap: 12px;
      align-items: end;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
      position: sticky;
      top: 12px;
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 0 11px;
      color: var(--text);
      background: #fff;
      font-size: 14px;
      outline: none;
    }

    select {
      cursor: pointer;
    }

    input:focus, select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.12);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      height: 38px;
      border: 0;
      border-radius: 10px;
      padding: 0 16px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button.secondary {
      background: #344054;
    }

    button:hover { background: var(--brand-dark); }
    button.secondary:hover { background: #1d2939; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-left: 4px;
    }

    .message {
      margin: 12px 0;
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .message.error { color: var(--danger); }
    .message.ok { color: var(--ok); }

    .suggest-wrap {
      position: relative;
    }

    .suggest {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      max-height: 280px;
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: #fff;
      box-shadow: var(--shadow);
      display: none;
      z-index: 30;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .suggest::-webkit-scrollbar { display: none; }

    .suggest.open {
      display: block;
      height: 280px;
    }

    .suggest-canvas {
      position: relative;
      width: 100%;
    }

    .suggest button {
      position: absolute;
      left: 0;
      width: 100%;
      height: 32px;
      border-radius: 0;
      background: #fff;
      color: var(--text);
      text-align: left;
      font-weight: 500;
      font-family: Consolas, "Microsoft YaHei", monospace;
    }

    .suggest button:hover { background: var(--header); }

    .sheet {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .sheet-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
      color: var(--muted);
      font-size: 13px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
      white-space: nowrap;
      table-layout: auto;
    }

    th, td {
      padding: 6px 8px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--header);
      color: #24364b;
      font-weight: 800;
    }

    tr:nth-child(even) td { background: var(--stripe); }
    tr:hover td { background: #e7f0fb; }

    .empty {
      padding: 46px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 920px) {
      .toolbar { grid-template-columns: 1fr; position: static; }
      .title { display: block; }
      .status { margin-top: 6px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="title">
      <h1>多周期股票数据视图看板</h1>
      <div id="status" class="status">接口：127.0.0.1:7899</div>
    </div>

    <section class="toolbar">
      <label class="suggest-wrap">
        代码
        <input id="codeInput" placeholder="例如 600633" autocomplete="off" />
        <div id="codeSuggest" class="suggest"></div>
      </label>

      <label class="suggest-wrap">
        开始日期
        <input id="dateStart" placeholder="YYYY-MM-DD 或 YYYYMMDD" autocomplete="off" />
        <div id="startSuggest" class="suggest"></div>
      </label>

      <label class="suggest-wrap">
        结束日期（可选）
        <input id="dateEnd" placeholder="YYYY-MM-DD 或 YYYYMMDD" autocomplete="off" />
        <div id="endSuggest" class="suggest"></div>
      </label>

      <label>
        周期频率
        <select id="frequencySelect">
          <option value="1d">日K (1d)</option>
          <option value="1m">1分钟 (1m)</option>
          <option value="5m">5分钟 (5m)</option>
          <option value="15m">15分钟 (15m)</option>
          <option value="30m">30分钟 (30m)</option>
          <option value="60m">60分钟 (60m)</option>
          <option value="1w">周K (1w)</option>
          <option value="1M">月K (1M)</option>
        </select>
      </label>

      <label>
        复权类型
        <select id="fqSelect">
          <option value="qfq">前复权</option>
          <option value="hfq">后复权</option>
          <option value="none">不复权</option>
        </select>
      </label>

      <div class="actions">
        <button id="readBtn">读取数据</button>
        <button id="exportBtn" class="secondary" disabled>导出 Excel/CSV</button>
        <span id="dateHint" class="hint" style="margin-left: 12px; font-size: 11px; line-height: 1.35; color: var(--muted); white-space: pre-line; display: inline-block; vertical-align: middle;">输入代码加载提示。</span>
      </div>
    </section>

    <div id="message" class="message" style="margin: 6px 0;"></div>

    <section class="sheet">
      <div class="sheet-meta">
        <span id="sheetTitle">未加载数据</span>
        <span id="rowCount">0 行</span>
      </div>
      <div class="table-wrap" id="tableWrap">
        <div class="empty">请输入代码、时间并选择周期，然后点击读取。</div>
      </div>
    </section>
  </main>

  <script>
    window.baseurl = window.baseurl || '127.0.0.1:7899';
  </script>
  <script src="./gp.js"></script>
  <script src="./viewer.js"></script>
</body>
</html>
